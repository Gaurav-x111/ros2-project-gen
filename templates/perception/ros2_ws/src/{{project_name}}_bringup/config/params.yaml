# {{project_name}} Perception Configuration Parameters

robot:
  name: "{{project_name}}"
  type: "differential_drive"

perception:
  camera:
    enabled: true
    frame_id: "camera_link"
    image_topic: "/camera/image_raw"
  lidar:
    enabled: true
    frame_id: "laser_link"
    points_topic: "/lidar/points"
  inference:
    model_path: "models/yolov8.onnx"
    confidence_threshold: 0.5