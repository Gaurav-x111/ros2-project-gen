[package]
name = "ros2-project-gen"
version = "0.1.0"
edition = "2021"
description = "Scaffold production-ready ROS 2 projects from battle-tested templates"
license = "MIT"
repository = "https://github.com/Gaurav-x111/ros2-project-gen"
keywords = ["ros2", "robotics", "scaffold", "template", "colcon"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
walkdir = "2.5"
include_dir = "0.7"
regex = "1.10"
which = "5.0"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
walkdir = "2.5"

[profile.release]
lto = true
strip = true
codegen-units = 1